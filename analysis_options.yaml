include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # This is an app, not a published package; comments explain intent
    # where it isn't obvious instead of documenting every member.
    public_member_api_docs: false
    # Repository interfaces start with one method and gain more as each
    # feature grows; they are a deliberate seam, not accidental ceremony.
    one_member_abstracts: false
